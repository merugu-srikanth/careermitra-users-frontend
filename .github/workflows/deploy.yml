name: Deploy Frontend

on:
  push:
    branches:
      - main
      - prod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Build Vite project
      - name: Build Project
        run: npm run build

      # Determine deployment target
      - name: Set Deployment Variables
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "DEPLOY_DIR=/var/www/careermitra-prod" >> $GITHUB_ENV
            echo "DOMAIN=careermitra.in" >> $GITHUB_ENV
            echo "ENVIRONMENT=Production" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=/var/www/careermitra-user" >> $GITHUB_ENV
            echo "DOMAIN=careermitra.tech" >> $GITHUB_ENV
            echo "ENVIRONMENT=Staging" >> $GITHUB_ENV
          fi

      # Deploy
      - name: Deploy Application
        run: |
          echo "=================================="
          echo "Environment : $ENVIRONMENT"
          echo "Domain      : $DOMAIN"
          echo "Deploy Dir  : $DEPLOY_DIR"
          echo "=================================="

          mkdir -p "$DEPLOY_DIR"

          rsync -av --delete dist/ "$DEPLOY_DIR"/

          echo "Deployment completed successfully 🚀"
